`})]})]}),(0,C.jsxs)(`div`,{className:`space-y-1`,children:[(0,C.jsx)(`span`,{className:`font-bold text-slate-800 block`,children:`Contoh Proses:`}),(0,C.jsx)(`ul`,{className:`list-disc list-inside space-y-1 text-slate-600`,children:ln.oxidativePhosphorylation.examples.map((e,t)=>(0,C.jsx)(`li`,{children:e},t))})]})]})]})}),(0,C.jsxs)(`div`,{className:`p-4 rounded-2xl bg-white border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4`,children:[(0,C.jsxs)(`div`,{className:`flex items-center gap-2 text-xs text-slate-600`,children:[(0,C.jsx)(`span`,{className:`font-bold text-slate-800`,children:`Target Belajar:`}),(0,C.jsx)(`span`,{children:`F₀F₁ Rotasi, Rasio P/O ~2.5 & ~1.5, dan Neraca 30 vs 32 ATP`})]}),(0,C.jsxs)(`div`,{className:`flex items-center gap-3`,children:[(0,C.jsx)(`button`,{type:`button`,onClick:()=>{y.playClick(),t(`map`)},className:`px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 text-slate-700 hover:bg-slate-50`,children:`Peta Metabolisme`}),(0,C.jsxs)(`button`,{type:`button`,onClick:()=>{y.playLevelVictory(),n(5,100),t(`clinical`)},className:`px-5 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-teal-600 to-indigo-600 hover:from-teal-500 hover:to-indigo-500 text-white shadow-md shadow-teal-600/20 flex items-center gap-1.5`,children:[(0,C.jsx)(`span`,{children:`Lanjut ke 5 Kasus Klinis`}),(0,C.jsx)(pe,{className:`w-4 h-4`})]})]})]})]})},dn=[{id:`case-1-rbc`,title:`Kasus 1: Eritrosit Matang Tanpa Mitokondria`,subtitle:`Metabolisme Energi Sel Darah Merah (RBC)`,scenario:`Seorang mahasiswa kedokteran mengamati sampel eritrosit tepi manusia. Sel darah merah matang tidak memiliki nukleus dan organel, termasuk mitokondria, namun tetap memerlukan ATP untuk mempertahankan gradien ion dan fleksibilitas membran selnya.`,biochemicalContext:`Ketiadaan mitokondria berarti eritrosit tidak memiliki rantai transpor elektron, siklus Krebs, maupun ATP synthase. Sel ini bergantung 100% pada glikolisis anaerobik obligat di sitosol.`,questions:[{parameter:`Produksi ATP Bersih per Glukosa`,expectedChange:`menurun`,options:[{label:`Meningkat drastis (>30 ATP)`,value:`meningkat`},{label:`Menurun drastis (Hanya 2 ATP neto)`,value:`menurun`},{label:`Nol (0 ATP)`,value:`tetap_atau_nol`}],explanation:`Eritrosit hanya menghasilkan 2 ATP neto per molekul glukosa via substrate-level phosphorylation pada glikolisis (langkah PGK dan PK), dibandingkan 30-32 ATP pada sel bermitokondria.`},{parameter:`Produksi dan Pelepasan Laktat`,expectedChange:`meningkat`,options:[{label:`Meningkat tinggi (100% piruvat menjadi laktat)`,value:`meningkat`},{label:`Menurun tajam`,value:`menurun`},{label:`Nol laktat`,value:`tetap_atau_nol`}],explanation:`Untuk meregenerasi NAD⁺ agar enzim GAPDH tetap dapat bekerja dan menjaga produksi 2 ATP, seluruh piruvat diubah menjadi laktat oleh enzim Lactate Dehydrogenase (LDH) dan diekspor ke plasma darah menuju siklus Cori di hati.`},{parameter:`Konsumsi Oksigen (O₂) oleh Sel untuk Sintesis ATP`,expectedChange:`tetap_atau_nol`,options:[{label:`Meningkat`,value:`meningkat`},{label:`Menurun`,value:`menurun`},{label:`Nol (0 O₂ digunakan untuk respirasi seluler)`,value:`tetap_atau_nol`}],explanation:`Walaupun eritrosit bertugas mengangkut miliaran molekul O₂ melalui hemoglobin, eritrosit TIDAK mengonsumsi molekul O₂ tersebut untuk metabolisme energinya sendiri karena ketiadaan Kompleks IV mitokondria.`}],clinicalPearl:`Eritrosit juga memiliki Rapoport-Luebering Shunt yang mengubah 1,3-BPG menjadi 2,3-Bisphosphoglycerate (2,3-BPG). Shunt ini memintas pembentukan ATP pada langkah PGK (sehingga menghasilkan 0 ATP neto), namun 2,3-BPG sangat penting sebagai allosteric effector yang menurunkan afinitas hemoglobin terhadap oksigen, memfasilitasi pelepasan O₂ ke jaringan perifer!`},{id:`case-2-hypoxia`,title:`Kasus 2: Hipoksia Jaringan Akut`,subtitle:`Iskemia Miokardium / Syok Sirkulasi`,scenario:`Seorang pasien mengalami oklusi arteri koroner akut yang menyebabkan infark miokardium. Suplai darah dan oksigen terhenti secara mendadak pada area otot jantung yang terkena.`,biochemicalContext:`Oksigen adalah akseptor elektron terakhir pada Kompleks IV. Tanpa O₂, elektron terhenti di seluruh rantai respirasi (macet total).`,questions:[{parameter:`Aliran Elektron pada Rantai Transpor Elektron (ETC)`,expectedChange:`menurun`,options:[{label:`Meningkat`,value:`meningkat`},{label:`Menurun / Berhenti total`,value:`menurun`},{label:`Tetap normal`,value:`tetap_atau_nol`}],explanation:`Ketiadaan O₂ menyebabkan Kompleks IV tidak dapat melepas elektron. Hal ini menimbulkan efek domino retrograde: Cytochrome c, Kompleks III, CoQ, dan Kompleks I tereduksi penuh dan tidak dapat menerima elektron baru.`},{parameter:`Gradien Proton (Proton-Motive Force) & Sintesis ATP Mitokondria`,expectedChange:`menurun`,options:[{label:`Meningkat tinggi`,value:`meningkat`},{label:`Menurun drastis / Kolaps`,value:`menurun`},{label:`Tetap stabil`,value:`tetap_atau_nol`}],explanation:`Karena pemompaan proton oleh Kompleks I, III, dan IV terhenti, gradien elektrokimia proton melintasi membran dalam kolaps. ATP synthase tidak lagi dapat mensintesis ATP, bahkan dapat berbalik arah menghidrolisis ATP seluler jika tidak dihambat oleh IF1.`},{parameter:`Produksi Laktat Jaringan & pH Darah`,expectedChange:`meningkat`,options:[{label:`Produksi Laktat Meningkat (Asidosis Laktat)`,value:`meningkat`},{label:`Produksi Laktat Menurun`,value:`menurun`},{label:`Tidak ada perubahan`,value:`tetap_atau_nol`}],explanation:`Akumulasi NADH dan AMP menstimulasi fluks glikolisis anaerobik kompensatori. Piruvat dialihkan besar-besaran menjadi laktat oleh LDH untuk meregenerasi NAD⁺, menyebabkan akumulasi asam laktat dan asidosis intraseluler yang merusak miosit.`}],clinicalPearl:`Kadar laktat serum darah adalah biomarker perfusi jaringan kritis di Unit Gawat Darurat dan ICU. Hiperlaktatemia (>2 mmol/L) menandakan hipoksia seluler atau penurunan klirens laktat hepatik pada syok septik/kardiogenik.`},{id:`case-3-pk-deficiency`,title:`Kasus 3: Defisiensi Pyruvate Kinase pada Eritrosit`,subtitle:`Anemia Hemolitik Kongenital Nonsferositik`,scenario:`Seorang anak berusia 6 tahun datang dengan pucat, ikterus, dan splenomegali. Pemeriksaan laboratorium menunjukkan anemia hemolitik dengan retikulositosis, hiperbilirubinemia indirek, dan penurunan aktivitas enzim Pyruvate Kinase eritrosit.`,biochemicalContext:`Pyruvate kinase mengkatalisis langkah ke-10 glikolisis (PEP + ADP → Pyruvate + ATP), yang merupakan langkah substrate-level phosphorylation kedua yang menghasilkan ATP bersih.`,questions:[{parameter:`Kadar ATP Intraseluler Eritrosit`,expectedChange:`menurun`,options:[{label:`Meningkat`,value:`meningkat`},{label:`Menurun drastis (Defisit energi)`,value:`menurun`},{label:`Tetap normal`,value:`tetap_atau_nol`}],explanation:`Fase investasi glikolisis menggunakan 2 ATP. Tanpa pyruvate kinase fungsional, sel hanya memperoleh 2 ATP dari PGK, sehingga hasil ATP BERSIH adalah NOL (2 didapat - 2 dipakai = 0). Eritrosit kekurangan energi parah.`},{parameter:`Kadar 2,3-Bisphosphoglycerate (2,3-BPG) dalam Eritrosit`,expectedChange:`meningkat`,options:[{label:`Meningkat signifikan (Akumulasi upstream)`,value:`meningkat`},{label:`Menurun drastis`,value:`menurun`},{label:`Nol`,value:`tetap_atau_nol`}],explanation:`Blokade pada langkah akhir glikolisis menyebabkan penumpukan metabolit perantara di hulu (PEP, 2-PG, 3-PG, dan 1,3-BPG). Akumulasi 1,3-BPG memicu pengalihan berlebih ke jalur Rapoport-Luebering, meningkatkan kadar 2,3-BPG intraseluler.`},{parameter:`Mekanisme Hemolisis (Kerusakan Membran Sel)`,expectedChange:`meningkat`,options:[{label:`Rigiditas membran & lisis meningkat (Kelainan Na⁺/K⁺-ATPase)`,value:`meningkat`},{label:`Ketahanan membran meningkat`,value:`menurun`},{label:`Membran tidak terpengaruh`,value:`tetap_atau_nol`}],explanation:`Kekurangan ATP menyebabkan kegagalan pompa Na⁺/K⁺-ATPase membran. Ion K⁺ dan air bocor keluar, eritrosit kehilangan fleksibilitas (dehidrasi seluler), membentuk ekinosit kaku yang terjebak dan dihancurkan oleh makrofag di sinus limpa (splenomegali & hemolisis ekstravaskular).`}],clinicalPearl:`Meskipun mengalami anemia, pasien dengan defisiensi pyruvate kinase sering kali memiliki toleransi olahraga yang relatif lebih baik daripada yang diperkirakan dari kadar Hb-nya. Mengapa? Karena akumulasi 2,3-BPG menggeser kurva disosiasi oksigen-hemoglobin ke kanan, mempermudah pelepasan oksigen ke jaringan perifer!`},{id:`case-4-cyanide`,title:`Kasus 4: Keracunan Sianida (Cyanide Toxicity)`,subtitle:`Asfiksia Seluler Akibat Inhibisi Kompleks IV`,scenario:`Seorang pekerja industri kimia terpapar gas hidrogen sianida (HCN) akibat kebocoran tabung. Pasien segera mengalami dispnea berat, penurunan kesadaran, dan asidosis metabolik parah dengan celah anion tinggi, namun darah venanya berwarna merah terang (teroksigenasi tinggi).`,biochemicalContext:`Sianida (CN⁻) mengikat ion besi ferri (Fe³⁺) pada gugus heme a₃ di situs aktif Cytochrome c Oxidase (Kompleks IV) mitokondria dengan afinitas sangat tinggi.`,questions:[{parameter:`Konsumsi Oksigen (O₂) oleh Sel Tubuh`,expectedChange:`menurun`,options:[{label:`Meningkat tajam`,value:`meningkat`},{label:`Menurun drastis hingga mendekati nol`,value:`menurun`},{label:`Tidak berubah`,value:`tetap_atau_nol`}],explanation:`Inhibisi Kompleks IV oleh CN⁻ memblokir reduksi O₂ menjadi H₂O. Akibatnya, mitokondria tidak dapat lagi mengonsumsi O₂ yang dihantarkan darah, menjelaskan fenomena mengapa darah vena tetap kaya O₂ dan berwarna merah terang (vena beroksigenasi tinggi).`},{parameter:`Gradien Proton Membran Dalam Mitokondria`,expectedChange:`menurun`,options:[{label:`Meningkat`,value:`meningkat`},{label:`Menurun drastis / Lenyap`,value:`menurun`},{label:`Tetap konstan`,value:`tetap_atau_nol`}],explanation:`Pemompaan proton oleh Kompleks I, III, dan IV berhenti total karena aliran elektron terblokir di Kompleks IV. Proton-motive force segera habis terpakai dan sintesis ATP mitokondria terhenti.`},{parameter:`Kadar Asam Laktat Darah (Lactate)`,expectedChange:`meningkat`,options:[{label:`Meningkat sangat drastis (Asidosis Laktat Parah)`,value:`meningkat`},{label:`Menurun`,value:`menurun`},{label:`Nol`,value:`tetap_atau_nol`}],explanation:`Krisis energi seluler memicu glikolisis anaerobik maksimal sebagai upaya terakhir sel mempertahankan ATP. Seluruh piruvat diubah menjadi laktat, memicu asidosis laktat berat yang mengancam nyawa.`}],clinicalPearl:`Antidotum keracunan sianida meliputi Hydroxocobalamin (Vitamin B12a) yang mengikat CN⁻ membentuk Cyanocobalamin (tidak toksik diekskresikan di ginjal), atau kombinasi Sodium Nitrite (menginduksi methemoglobinemia Fe³⁺ untuk menarik CN⁻ dari mitokondria) ditambah Sodium Thiosulfate (donor sulfur untuk enzim rhodanese).`},{id:`case-5-uncoupling`,title:`Kasus 5: Uncoupling Mitokondria & Toksisitas 2,4-DNP`,subtitle:`Disipasi Gradien Proton Menjadi Panas / Termogenesis`,scenario:`Seorang binaragawan mengonsumsi suplemen ilegal 2,4-Dinitrophenol (DNP) untuk menurunkan berat badan cepat. Beberapa jam kemudian, ia dilarikan ke rumah sakit dengan demam sangat tinggi (hipertermia ganas >41°C), takikardia, takipnea, dan diaphoresis profus.`,biochemicalContext:`2,4-DNP adalah molekul lipofilik asam lemah yang berfungsi sebagai protonofor ionofor (uncoupler). DNP mengikat H⁺ di intermembrane space, berdifusi melintasi bilayer membran dalam, dan melepaskan H⁺ langsung ke matriks mitokondria tanpa melalui ATP synthase.`,questions:[{parameter:`Gradien Proton (Proton-Motive Force) Mitokondria`,expectedChange:`menurun`,options:[{label:`Meningkat`,value:`meningkat`},{label:`Menurun drastis (Disipasi bocor)`,value:`menurun`},{label:`Tetap sama`,value:`tetap_atau_nol`}],explanation:`DNP menyediakan jalan pintas bagi proton untuk bocor kembali ke matriks, menghancurkan gradien elektrokimia proton (menghilangkan gaya gerak proton) yang dibutuhkan untuk menggerakkan ATP synthase.`},{parameter:`Sintesis ATP oleh ATP Synthase`,expectedChange:`menurun`,options:[{label:`Meningkat pesat`,value:`meningkat`},{label:`Menurun drastis / Gagal sintesis`,value:`menurun`},{label:`Tidak terpengaruh`,value:`tetap_atau_nol`}],explanation:`Tanpa gradien proton melintasi rotor F₀, ATP synthase tidak memiliki tenaga mekanis putaran untuk memfosforilasi ADP menjadi ATP. Sel mengalami defisiensi ATP akut meskipun bahan bakar dibakar sangat cepat.`},{parameter:`Laju Aliran Elektron, Konsumsi Oksigen (O₂), dan Produksi Panas`,expectedChange:`meningkat`,options:[{label:`Meningkat sangat drastis (Hipermetabolisme & Hipertermia)`,value:`meningkat`},{label:`Menurun`,value:`menurun`},{label:`Tetap nol`,value:`tetap_atau_nol`}],explanation:`Hilangnya hambatan gradien proton (hilangnya kendali pernapasan/respiratory control) membuat rantai transpor elektron bekerja pada laju maksimal tanpa beban balik. Konsumsi O₂ melonjak tinggi, dan seluruh energi bebas oksidasi dilepaskan 100% sebagai ENERGI PANAS, memicu hipertermia fatal!`}],clinicalPearl:`Uncoupling fisiologis terjadi secara alami pada jaringan lemak coklat (Brown Adipose Tissue / BAT) pada neonatus dan hewan hibernasi melalui protein UCP1 (Thermogenin). UCP1 berfungsi menghasilkan panas non-shivering thermogenesis untuk menjaga suhu tubuh bayi yang memiliki rasio luas permukaan terhadap massa yang tinggi.`}],fn=()=>{let{setActiveView:e,recordQuizAnswer:t,addXP:n,unlockBadge:r}=O(),[i,a]=(0,_.useState)(0),[o,s]=(0,_.useState)({}),[c,l]=(0,_.useState)({}),[u,d]=(0,_.useState)(0),f=dn[i],p=o[f.id]||{},m=c[f.id]||!1,h=(e,t)=>{y.playClick(),s(n=>({...n,[f.id]:{...n[f.id]||{},[e]:t}}))};return(0,C.jsxs)(`div`,{className:`max-w-6xl mx-auto px-4 py-6 space-y-6`,children:[(0,C.jsxs)(`div`,{className:`flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4`,children:[(0,C.jsxs)(`div`,{className:`flex items-center gap-3`,children:[(0,C.jsxs)(`button`,{type:`button`,onClick:()=>{y.playClick(),e(`map`)},className:`p-2 rounded-xl text-slate  regulator utama glikolisis yang diinhibisi oleh ATP dan sitrat, serta distimulasi oleh AMP dan Fructose-2,6-bisphosphate.`,hint:`Enzim ini mengonversi F6P menjadi F-1,6-BP.`},{id:`glyc-4`,category:`Glikolisis`,question:`Perbedaan biologis penting manakah yang benar antara Glucokinase (hati/sel β) dan Hexokinase (jaringan perifer)?`,options:[`Glucokinase memiliki Km jauh lebih tinggi (afinitas lebih rendah) dan tidak dihambat oleh G6P`,`Hexokinase memiliki Km lebih tinggi dan aktif hanya saat hiperglikemia berat`,`Glucokinase dihambat kuat oleh akumulasi Glucose-6-phosphate`,`Hexokinase diregulasi oleh Glucokinase Regulatory Protein (GKRP) di nukleus`],correctAnswerIndex:0,explanation:`Glucokinase (Hexokinase IV) memiliki Km tinggi (~10 mM), memungkinkannya memfosforilasi glukosa dalam jumlah besar hanya setelah makan (postprandial) di hati, dan tidak dihambat oleh produknya (G6P). Sebaliknya, Hexokinase I-III memiliki Km rendah (<0.1 mM) dan dihambat allosterik oleh G6P.`,hint:`Enzim di hati dirancang untuk membersihkan lonjakan glukosa tinggi setelah makan.`},{id:`glyc-5`,category:`Glikolisis`,question:`Enzim manakah yang menghasilkan NADH selama jalur glikolisis?`,options:[`Phosphoglucose isomerase`,`Glyceraldehyde-3-phosphate dehydrogenase (GAPDH)`,`Phosphoglycerate kinase (PGK)`,`Enolase`],correctAnswerIndex:1,explanation:`GAPDH mengkatalisis oksidasi dan fosforilasi G3P menjadi 1,3-Bisphosphoglycerate, mereduksi NAD⁺ menjadi 1 NADH per G3P (total 2 NADH per glukosa).`,hint:`Enzim dehydrogenase memerlukan kofaktor NAD⁺.`},{id:`glyc-6`,category:`Glikolisis`,question:`Dua reaksi manakah dalam glikolisis yang menghasilkan ATP secara langsung melalui Substrate-Level Phosphorylation?`,options:[`Hexokinase dan PFK-1`,`Aldolase dan Triose phosphate isomerase`,`Phosphoglycerate kinase (PGK) dan Pyruvate kinase (PK)`,`GAPDH dan Enolase`],correctAnswerIndex:2,explanation:`Substrate-level phosphorylation terjadi pada langkah 7 oleh Phosphoglycerate kinase (1,3-BPG + ADP → 3-PG + ATP) dan langkah 10 oleh Pyruvate kinase (PEP + ADP → Pyruvate + ATP).`,hint:`Cari dua enzim kinase yang menghasilkan ATP dari ADP.`},{id:`pyr-1`,category:`Nasib Pyruvate`,question:`Apakah tujuan biokimia utama reduksi piruvat menjadi laktat oleh enzim Lactate Dehydrogenase (LDH)?`,options:[`Menghasilkan lebih banyak molekul ATP di sitosol`,`Meregenerasi NAD⁺ agar glikolisis dapat terus berjalan pada langkah GAPDH`,`Mencegah mitokondria mengonsumsi terlalu banyak glukosa`,`Mengaktifkan transkripsi gen glukagon`],correctAnswerIndex:1,explanation:`LDH meregenerasi NAD⁺ dari NADH. Tanpa NAD⁺ teroksidasi, enzim GAPDH (langkah 6) akan kehabisan substrat koenzim sehingga seluruh glikolisis akan terhenti.`,hint:`Glikolisis membutuhkan pasokan NAD⁺ konstan di sitosol.`},{id:`pyr-2`,category:`Nasib Pyruvate`,question:`Manakah pernyataan yang PALING TEPAT mengenai pembentukan asam laktat dalam fisiologi manusia?`,options:[`Laktat hanya terbentuk ketika oksigen di dalam sel benar-benar 0% (anoksia total)`,`Laktat terbentuk secara konstan pada eritrosit normal dan serat otot saat laju glikolisis melampaui kapasitas oksidatif mitokondria`,`Glikolisis mengonsumsi molekul oksigen secara langsung`,`Laktat adalah racun metabolik yang tidak dapat diubah kembali menjadi metabolit lain`],correctAnswerIndex:1,explanation:`Laktat dibentuk secara fisiologis setiap saat oleh sel tanpa mitokondria (seperti eritrosit) dan saat laju glikolisis sangat tinggi. Glikolisis sendiri tidak menggunakan O₂ secara langsung, dan laktat didaur ulang oleh hati melalui Siklus Cori.`,hint:`Eritrosit selalu menghasilkan laktat meski di lingkungan kaya oksigen.`},{id:`pyr-3`,category:`Nasib Pyruvate`,question:`Pada kondisi aerobik dengan mitokondria intak, piruvat diubah menjadi Acetyl-CoA oleh Pyruvate Dehydrogenase (PDH) Complex di mana?`,options:[`Matriks mitokondria`,`Intermembrane space mitokondria`,`Permukaan luar membran mitokondria`,`Sitosol`],correctAnswerIndex:0,explanation:`Piruvat ditranspor melintasi membran dalam mitokondria oleh Pyruvate Translocase masuk ke dalam matriks mitokondria, lokasi keberadaan kompleks PDH.`,hint:`Siklus Krebs dan PDH berada di kompartemen paling dalam mitokondria.`},{id:`pyr-4`,category:`Nasib Pyruvate`,question:`Berapakah produk bersih yang dihasilkan dari oksidasi 2 molekul piruvat (hasil dari 1 glukosa) oleh Pyruvate Dehydrogenase Complex?`,options:[`1 Acetyl-CoA, 1 NADH, 1 CO₂`,`2 Acetyl-CoA, 2 NADH, 2 CO₂`,`2 Acetyl-CoA, 2 FADH₂, 2 ATP`,`2 Laktat, 2 NAD⁺, 0 CO₂`],correctAnswerIndex:1,explanation:`Setiap molekul piruvat (3C) melepaskan 1 CO₂ dan menghasilkan 1 Acetyl-CoA (2C) serta 1 NADH. Karena 1 glukosa menghasilkan 2 piruvat, totalnya adalah 2 Acetyl-CoA, 2 NADH, dan 2 CO₂.`,hint:`Ingat rumus per glukosa adalah 2 kali lipat per piruvat.`},{id:`pyr-5`,category:`Nasib Pyruvate`,question:`Defisiensi mikronutrien apakah yang secara spesifik mengganggu subunit E1 kompleks Pyruvate Dehydrogenase, memicu penumpukan piruvat dan laktat (penyakit Beriberi / Sindrom Wernicke-Korsakoff)?`,options:[`Vitamin B1 (Thiamine)`,`Vitamin C (Ascorbic acid)`,`Vitamin D (Calcitriol)`,`Vitamin A (Retinol)`],correctAnswerIndex:0,explanation:`Subunit E1 PDH memerlukan Thiamine Pyrophosphate (TPP), bentuk aktif Vitamin B1. Tanpa tiamin, oksidasi piruvat terhambat, memaksa piruvat diubah menjadi laktat dan memicu asidosis laktat serta defisit energi di sistem saraf/jantung.`,hint:`Vitamin B1 adalah prekursor TPP.`},{id:`krebs-1`,category:`Siklus Krebs`,question:`Berapakah hasil reducing equivalents dan energi langsung per SATU putaran Siklus Krebs (per 1 molekul Acetyl-CoA)?`,options:[`3 NADH, 1 FADH₂, 1 GTP (ATP), 2 CO₂`,`6 NADH, 2 FADH₂, 2 GTP (ATP), 4 CO₂`,`2 NADH, 2 FADH₂, 0 GTP, 1 CO₂`,`4 NADH, 0 FADH₂, 2 ATP, 2 CO₂`],correctAnswerIndex:0,explanation:`Per 1 Acetyl-CoA: 3 NADH (dari Isocitrate DH, α-KGDH, Malate DH), 1 FADH₂ (Succinate DH), 1 GTP (Succinyl-CoA synthetase), dan 2 CO₂. Nilai ini dikali 2 jika dihitung per 1 glukosa.`,hint:`Perhatikan apakah pertanyaannya per Acetyl-CoA atau per Glukosa.`},{id:`krebs-2`,category:`Siklus Krebs`,question:`Manakah pernyataan yang benar mengenai enzim Succinate Dehydrogenase dalam Siklus Krebs?`,options:[`Enzim ini larut bebas di matriks mitokondria`,`Enzim ini terikat pada membran dalam mitokondria dan berfungsi sebagai Kompleks II ETC`,`Enzim ini menghasilkan NADH larut bebas`,`Enzim ini dihambat kuat oleh sitrat`],correctAnswerIndex:1,explanation:`Succinate dehydrogenase adalah satu-satunya enzim siklus Krebs yang terikat pada membran dalam mitokondria. Enzim ini identik dengan Kompleks II pada rantai respirasi.`,hint:`Enzim ini menghubungkan siklus Krebs secara fisik langsung ke rantai respirasi.`},{id:`krebs-3`,category:`Siklus Krebs`,question:`Molekul 4-karbon apakah yang diregenerasi pada langkah terakhir Siklus Krebs oleh enzim Malate Dehydrogenase?`,options:[`Citrate`,`α-Ketoglutarate`,`Oxaloacetate`,`Fumarate`],correctAnswerIndex:2,explanation:`Oxaloacetate (4C) diregenerasi pada langkah ke-8 sehingga dapat berkondensasi kembali dengan molekul Acetyl-CoA baru (2C) untuk mengawali putaran siklus berikutnya.`,hint:`Molekul ini menerima asetil-CoA pada langkah pertama.`},{id:`krebs-4`,category:`Siklus Krebs`,question:`Enzim penentu laju (rate-limiting step) Siklus Krebs yang diaktivasi allosterik oleh ADP dan Ca²⁺ tetapi dihambat oleh ATP dan NADH adalah:`,options:[`Citrate synthase`,`Isocitrate dehydrogenase (IDH)`,`Fumarase`,`Aconitase`],correctAnswerIndex:1,explanation:`Isocitrate dehydrogenase mengkatalisis dekarboksilasi isositrat menjadi α-ketoglutarat. Enzim ini adalah pengatur laju siklus Krebs yang sangat sensitif terhadap rasio energi seluler (ADP vs ATP).`,hint:`Enzim ini menghasilkan NADH pertama dan CO₂ pertama di dalam siklus.`},{id:`krebs-5`,category:`Siklus Krebs`,question:`Per 1 molekul glukosa penuh yang mengalami glikolisis, oksidasi piruvat, dan siklus Krebs, berapakah total molekul CO₂ yang telah dilepaskan?`,options:[`2 CO₂`,`4 CO₂`,`6 CO₂`,`0 CO₂`],correctAnswerIndex:2,explanation:`Seluruh 6 atom karbon dari 1 molekul glukosa (C₆H₁₂O₆) dioksidasi menjadi CO₂: 2 CO₂ dari oksidasi piruvat (PDH) + 4 CO₂ dari 2 putaran Siklus Krebs = 6 CO₂ total.`,hint:`Glukosa memiliki 6 karbon; dalam oksidasi sempurna semuanya menjadi CO₂.`},{id:`etc-1`,category:`ETC`,question:`Kompleks rantai respirasi manakah yang TIDAK memompa proton (0 H⁺) ke intermembrane space?`,options:[`Kompleks I (NADH dehydrogenase)`,`Kompleks II (Succinate dehydrogenase)`,`Kompleks III (Cytochrome bc₁)`,`Kompleks IV (Cytochrome c oxidase)`],correctAnswerIndex:1,explanation:`Kompleks II (SDH) tidak menjangkau melintasi membran dan perubahan energi bebas redoksnya tidak cukup untuk memompa proton (0 H⁺ dipompa). Kompleks I memompa 4 H⁺, Kompleks III memompa 4 H⁺, dan Kompleks IV memompa 2 H⁺ per pasang elektron.`,hint:`Kompleks ini menggunakan kofaktor FAD yang terikat enzim.`},{id:`etc-2`,category:`ETC`,question:`Manakah molekul yang bertindak sebagai akseptor elektron terakhir (terminal electron acceptor) pada rantai transpor elektron mamalia?`,options:[`NAD⁺`,`Ubiquinone (CoQ)`,`Cytochrome c`,`Oksigen molekuler (O₂)`],correctAnswerIndex:3,explanation:`Oksigen (O₂) menerima 4 elektron dan 4 proton di Kompleks IV (Cytochrome c oxidase) untuk direduksi menjadi 2 molekul air (2 H₂O).`,hint:`Molekul ini dihirup saat respirasi eksternal paru.`},{id:`etc-3`,category:`ETC`,question:`Berapakah total proton (H⁺) yang dipompa keluar dari matriks ke intermembrane space untuk setiap 1 pasang elektron dari NADH matriks?`,options:[`4 proton (H⁺)`,`6 proton (H⁺)`,`10 proton (H⁺)`,`12 proton (H⁺)`],correctAnswerIndex:2,explanation:`Elektron dari NADH melewati Kompleks I (memompa 4 H⁺) → CoQ → Kompleks III (memompa 4 H⁺) → Cytochrome c → Kompleks IV (memompa 2 H⁺). Total = 4 + 4 + 2 = 10 H⁺.`,hint:`Jumlahkan proton dari Kompleks I (4), III (4), dan IV (2).`},{id:`etc-4`,category:`ETC`,question:`Apakah sifat biokimia dari FADH₂ yang terbentuk pada Kompleks II?`,options:[`Merupakan molekul terlarut bebas yang berdifusi melintasi matriks ke Kompleks II`,`Merupakan gugus prostetik terikat kovalen di dalam subunit flavoprotein Kompleks II`,`Merupakan lipid membran yang larut dalam kolesterol`,`Merupakan ion anorganik bebas`],correctAnswerIndex:1,explanation:`FAD/FADH₂ terikat kovalen/sangat erat sebagai gugus prostetik pada enzim Succinate Dehydrogenase (Kompleks II), bukan molekul pembawa yang berenang bebas di matriks.`,hint:`FAD adalah prosthetic group, berbeda dari NAD⁺ yang merupakan kosubstrat larut.`},{id:`etc-5`,category:`ETC`,question:`Manakah komponen rantai transpor elektron yang merupakan pembawa elektron mobile larut lemak (lipofilik) di dalam bilayer membran?`,options:[`Cytochrome c`,`Coenzyme Q (Ubiquinone)`,`FMN`,`Kompleks I`],correctAnswerIndex:1,explanation:`Coenzyme Q (Ubiquinone) memiliki ekor poli-isoprenoid hidrofobik panjang yang memungkinkannya berdifusi bebas di dalam inti lipid membran dalam mitokondria.`,hint:`Molekul ini juga dikenal sebagai CoQ10.`},{id:`atp-1`,category:`ATP Synthase & Neraca`,question:`Berapakah perkiraan rasio P/O modern (ATP yang dihasilkan per molekul pembawa teroksidasi) untuk NADH matriks dan FADH₂?`,options:[`3.0 ATP per NADH dan 2.0 ATP per FADH₂`,`Sekitar 2.5 ATP per NADH dan 1.5 ATP per FADH₂`,`1.0 ATP per NADH dan 1.0 ATP per FADH₂`,`4.0 ATP per NADH dan 2.0 ATP per FADH₂`],correctAnswerIndex:1,explanation:`Berdasarkan stoikiometri modern pemompaan proton (10 H⁺ per NADH, 6 H⁺ per FADH₂) dan kebutuhan ~4 H⁺ per sintesis & ekspor 1 ATP, rasionya adalah ~2.5 ATP per NADH dan ~1.5 ATP per FADH₂.`,hint:`Berdasarkan perbandingan 10/4 dan 6/4.`},{id:`atp-2`,category:`ATP Synthase & Neraca`,question:`Jaringan manakah yang secara klasik menggunakan Glycerol-3-Phosphate Shuttle, menghasilkan total net ~30 ATP per glukosa?`,options:[`Jantung dan Hati`,`Ginjal dan Hati`,`Otot rangka (Skeletal muscle) dan Otak`,`Eritrosit`],correctAnswerIndex:2,explanation:`Otot rangka dan otak aktif menggunakan Glycerol-3-Phosphate Shuttle yang memasukkan elektron langsung ke CoQ via FAD, menghasilkan ~1.5 ATP per NADH sitosol (total ~30 ATP). Jantung dan hati menggunakan Malate-Aspartate Shuttle (total ~32 ATP).`,hint:`Shuttle ini mengorbankan 1 ATP per NADH untuk kecepatan respon di otot dan otak.`},{id:`atp-3`,category:`ATP Synthase & Neraca`,question:`Jika suatu sel menggunakan Malate-Aspartate Shuttle, berapakah estimasi hasil ATP bersih stoikiometrik per molekul glukosa?`,options:[`2 ATP`,`30 ATP`,`32 ATP`,`38 ATP (nilai perkiraan lama)`],correctAnswerIndex:2,explanation:`Dengan Malate-Aspartate Shuttle: 2 ATP neto glikolisis + 2 GTP Krebs + (10 NADH × 2.5 = 25 ATP) + (2 FADH₂ × 1.5 = 3 ATP) = 4 + 25 + 3 = 32 ATP.`,hint:`Malate-aspartate shuttle mengonversi 2 NADH sitosol menjadi 2 NADH matriks (menghasilkan 5 ATP).`},{id:`atp-4`,category:`ATP Synthase & Neraca`,question:`Gaya apakah yang menggerakkan sintesis ATP oleh subunit F₁ ATP Synthase saat proton mengalir kembali ke matriks melalui F₀?`,options:[`Gaya gravitasi mitokondria`,`Proton-Motive Force (gradien potensial membran listrik ΔΨ dan gradien konsentrasi pH ΔpH)`,`Tekanan osmotik sitosol`,`Hidrolisis GTP di sitosol`],correctAnswerIndex:1,explanation:`Gaya gerak proton (Proton-Motive Force, Δp) merupakan kombinasi gradien muatan listrik (sisi matriks negatif) dan gradien pH (matriks lebih basa), dirumuskan oleh Peter Mitchell.`,hint:`Dikenal sebagai kemiosmosis (chemiosmosis).`},{id:`clin-1`,category:`Klinis`,question:`Bagaimanakah mekanisme toksisitas racun Sianida (Cyanide) yang berakibat fatal pada respirasi seluler?`,options:[`Menghambat Hexokinase pada glikolisis`,`Mengikat ion Fe³⁺ pada heme a₃ Kompleks IV (Cytochrome c oxidase), menghentikan reduksi O₂`,`Menghancurkan membran luar mitokondria`,`Menginaktivasi pompa Na⁺/K⁺-ATPase secara langsung`],correctAnswerIndex:1,explanation:`Sianida mengikat kuat ion Fe³⁺ pada kompleks IV, memblokir transfer elektron ke O₂. Rantai respirasi macet seketika, konsumsi O₂ anjlok ke nol, dan gradien proton lenyap.`,hint:`Sianida adalah racun spesifik Kompleks IV.`},{id:`clin-2`,category:`Klinis`,question:`Apa akibat fisiologis dari zat "uncoupler" seperti 2,4-Dinitrophenol (DNP) atau protein Thermogenin (UCP1) terhadap mitokondria?`,options:[`Menghentikan aliran elektron dan konsumsi O₂`,`Membocorkan proton kembali ke matriks tanpa melewati ATP synthase, mendisipasikan energi menjadi panas murni`,`Meningkatkan produksi ATP hingga 100 ATP per glukosa`,`Menginaktivasi enzim Siklus Krebs secara permanen`],correctAnswerIndex:1,explanation:`Uncoupler menyediakan jalur bocor bagi proton melintasi membran dalam. Hal ini melenyapkan gradien proton sehingga ATP tidak terbentuk, sedangkan aliran elektron dan konsumsi O₂ justru melonjak cepat dengan seluruh energi terbuang sebagai panas (hipertermia).`,hint:`Uncoupler memisahkan oksidasi dari fosforilasi.`},{id:`clin-3`,category:`Klinis`,question:`Pada defisiensi Pyruvate Kinase eritrosit, mengapa terjadi anemia hemolitik?`,options:[`Eritrosit kekurangan NADPH sehingga rentan stres oksidatif`,`Eritrosit kekurangan ATP sehingga pompa ion Na⁺/K⁺-ATPase gagal, menyebabkan hilangnya air/K⁺, membran kaku, dan lisis di limpa`,`Eritrosit memproduksi terlalu banyak asam laktat di sumsum tulang`,`Eritrosit tidak dapat mengikat oksigen pada hemoglobin`],correctAnswerIndex:1,explanation:`Tanpa PK fungsional, hasil ATP bersih eritrosit adalah 0. Tanpa ATP, pompa Na⁺/K⁺ gagal mempertahankan homeostasis cairan, menyebabkan dehidrasi eritrosit, bentuk kaku (ekinosit), dan hemolisis ekstravaskular di limpa.`,hint:`Pompa ion membran eritrosit membutuhkan ATP konstan untuk menjaga kelenturan bentuknya.`},{id:`clin-4`,category:`Klinis`,question:`Pada kondisi iskemia jantung akut (hipoksia), mengapa kadar laktat miokardium melonjak tinggi?`,options:[`Karena NADH mitokondria masuk ke sitosol dan membakar glukosa`,`Karena terhentinya Kompleks IV akibat ketiadaan O₂ menyebabkan penumpukan NADH, memaksa sel melakukan glikolisis anaerobik dan reduksi piruvat menjadi laktat via LDH`,`Karena siklus Krebs menghasilkan laktat secara langsung saat dingin`,`Karena eritrosit melepaskan laktat ke dalam lumen arteri koroner`],correctAnswerIndex:1,explanation:`Tanpa O₂, transpor elektron berhenti sehingga NADH terakumulasi. Sel memicu glikolisis anaerobik darurat dan enzim LDH mereduksi piruvat menjadi laktat untuk meregenerasi NAD⁺, menyebabkan asidosis laktat lokal.`,hint:`Hipoksia memicu ketergantungan penuh pada glikolisis anaerobik.`},{id:`clin-5`,category:`Klinis`,question:`Mengapa eritrosit matang manusia tetap memproduksi laktat meskipun berada di dalam darah arteri yang sangat kaya akan oksigen terlarut dan oksihemoglobin?`,options:[`Karena eritrosit tidak memiliki mitokondria sehingga tidak mampu melakukan respirasi aerobik apapun`,`Karena hemoglobin menghambat enzim pyruvate dehydrogenase`,`Karena plasma darah bersifat asam kuat`,`Karena glukosa tidak dapat masuk ke dalam eritrosit`],correctAnswerIndex:0,explanation:`Eritrosit matang tidak memiliki organel sel maupun mitokondria. Oleh sebab itu, keberadaan oksigen tidak relevan bagi respirasi seluler eritrosit; sel ini adalah fermentor anaerob obligat.`,hint:`Ketiadaan mitokondria menghalangi jalur aerobik.`}];function mn(){let e=[`glyc-2`,`glyc-3`,`pyr-1`,`pyr-2`,`krebs-1`,`krebs-2`,`etc-1`,`etc-2`,`atp-1`,`clin-1`];return pn.filter(t=>e.includes(t.id))}function hn(){let e=[`glyc-4`,`glyc-6`,`pyr-4`,`krebs-3`,`krebs-4`,`etc-3`,`etc-4`,`atp-3`,`clin-2`,`clin-3`];return pn.filter(t=>e.includes(t.id))}var gn=({type:e})=>{let{progress:t,setActiveView:n,savePreTestScore:r,savePostTestScore:i,recordQuizAnswer:a,addXP:o,unlockBadge:s}=O(),c=e===`pre`,l=c?mn():hn(),[u,d]=(0,_.useState)(0),[f,p]=(0,_.useState)({}),[m,h]=(0,_.useState)({}),[g,v]=(0,_.useState)(!1),[b,S]=(0,_.useState)(!1),w=l[u],T=f[w.id],E=T===w.correctAnswerIndex,D=e=>{if(g)return;p(t=>({...t,[w.id]:e})),h(e=>({...e,[w.id]:!0}));let u ke CoQ, menghasilkan 1.5 ATP per NADH sitosol.`,clinicalRelevance:`Menghasilkan total 30 ATP per glukosa; mengorbankan 1 ATP per NADH demi laju fluks metabolisme yang sangat cepat selama aktivitas neuromuskular tinggi.`},{term:`Lactate Dehydrogenase`,abbreviation:`LDH`,category:`Enzim`,definition:`Enzim sitosol yang mengkatalisis reduksi piruvat menjadi laktat secara reversibel dengan mengoksidasi NADH menjadi NAD⁺.`,clinicalRelevance:`Isoenzim LDH (LDH-1 di jantung hingga LDH-5 di otot/hati) dapat diukur dalam serum darah untuk mengevaluasi infark miokard, hemolisis, atau keganasan tumor.`},{term:`Succinate Dehydrogenase`,abbreviation:`SDH / Kompleks II`,category:`Kompleks`,definition:`Satu-satunya enzim yang berpartisipasi ganda dalam Siklus Krebs (oksidasi suksinat menjadi fumarat) dan Rantai Transpor Elektron (transfer elektron ke CoQ). Terikat pada membran dalam mitokondria.`,clinicalRelevance:`Mutasi pada subunit SDH merupakan tumor suppressor defect yang dikaitkan dengan paraganglioma dan feokromositoma familial.`}],vn=()=>{let{setActiveView:e}=O(),[t,n]=(0,_.useState)(``),[r,i]=(0,_.useState)(`all`),a=[`all`,`Metabolit`,`Enzim`,`Kompleks`,`Konsep`],o=_n.filter(e=>{let n=e.term.toLowerCase().includes(t.toLowerCase())||e.abbreviation&&e.abbreviation.toLowerCase().includes(t.toLowerCase())||e.definition.toLowerCase().includes(t.toLowerCase()),i=r===`all`||e.category===r;return n&&i});return(0,C.jsxs)(`div`,{className:`max-w-4xl mx-auto px-4 py-6 space-y-6`,children:[(0,C.jsx)(`div`,{className:`flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4`,children:(0,C.jsxs)(`div`,{className:`flex items-center gap-3`,children:[(0,C.jsxs)(`button`,{type:`button`,onClick:()=>e(`map`),className:`p-2 rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200 transition-colors flex items-center gap-1.5 text-xs font-semibold`,children:[(0,C.jsx)(de,{className:`w-4 h-4`}),(0,C.jsx)(`span`,{children:`Kembali ke Peta`} <button id="mq-support-button" type="button" aria-haspopup="dialog" aria-controls="mq-support-modal">♡ Dukung Aplikasi</button>
<div id="mq-support-modal" hidden>
  <section id="mq-support-panel" role="dialog" aria-modal="true" aria-labelledby="mq-support-title">
    <button id="mq-support-close" type="button" aria-label="Tutup">×</button>
    <h2 id="mq-support-title">Dukung MetaboQuest</h2>
    <p>MetaboQuest disediakan gratis untuk mendukung pembelajaran biokimia. Jika berkenan, Anda dapat memberikan dukungan sukarela melalui QRIS berikut.</p>
    <img src="assets/qris-donasi.jpeg" alt="QRIS dukungan sukarela MetaboQuest" loading="lazy">
    <small>Dukungan sepenuhnya sukarela dan tidak diperlukan untuk mengakses materi.</small>
  </section>
</div>
<script>
(function(){
  const trigger=document.getElementById('mq-support-button');
  const modal=document.getElementById('mq-support-modal');
  const close=document.getElementById('mq-support-close');
  function dismiss(){modal.hidden=true;trigger.focus()}
  trigger.addEventListener('click',()=>{modal.hidden=false;close.focus()});
  close.addEventListener('click',dismiss);
  modal.addEventListener('click',e=>{if(e.target===modal)dismiss()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)dismiss()});
})();
</script>
